<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Учитель Онлайн V6.0.0</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    :root{
      --bg-light: #f8fafb;
      --fg-light: #1a1a1a;
      --card-light: #ffffff;
      --bg-dark: #0f1419;
      --fg-dark: #e4e6eb;
      --card-dark: #1e2329;
      --input-bg-light: #f5f5f5;
      --input-bg-dark: #0f1419;
      --input-fg-light: #1a1a1a;
      --input-fg-dark: #d4dce9;
      --input-border-light: #e0e0e0;
      --input-border-dark: #2a3f5f;
      --primary: #1f7adb;
      --primary-dark: #0d47a1;
      --muted: #999;
      --success: #27ae60;
      --danger: #e74c3c;
      --warning: #f39c12;
    }
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
    body.light-theme{--bg:var(--bg-light);--fg:var(--fg-light);--card:var(--card-light);--input-bg:var(--input-bg-light);--input-fg:var(--input-fg-light);--input-border:var(--input-border-light)}
    body.dark-theme{--bg:var(--bg-dark);--fg:var(--fg-dark);--card:var(--card-dark);--input-bg:var(--input-bg-dark);--input-fg:var(--input-fg-dark);--input-border:var(--input-border-dark)}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid var(--input-border)}
    h1{margin:0;font-size:28px;font-weight:700;color:var(--primary)}
    .tabs{display:flex;gap:5px;margin-bottom:20px;border-bottom:2px solid var(--input-border);flex-wrap:wrap}
    .tab-btn{background:transparent;border:none;padding:12px 20px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:all 0.3s;position:relative;top:2px}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .card{background:var(--card);padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:20px}
    input,textarea,select,button{padding:12px 14px;border-radius:8px;border:1px solid var(--input-border);font-size:14px;background:var(--input-bg);color:var(--input-fg);font-family:inherit}
    input,textarea,select{width:100%;margin-top:8px}
    textarea{min-height:100px;resize:vertical}
    .note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
    .note-card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:all 0.3s;border:1px solid var(--input-border);cursor:pointer}
    .note-card:hover{transform:translateY(-4px);box-shadow:0 4px 16px rgba(31,122,219,0.12)}
    .note-card h4{margin:0 0 8px 0;font-size:16px;font-weight:600;color:var(--primary)}
    .note-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
    .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
    .badge-class{background:rgba(31,122,219,0.15);color:var(--primary)}
    .btn{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;font-weight:600;transition:all 0.3s;display:inline-block;font-size:14px}
    .btn:hover{background:var(--primary-dark);transform:translateY(-2px)}
    .btn:active{transform:translateY(0)}
    .btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
    .btn.ghost:hover{background:rgba(31,122,219,0.08)}
    .btn.danger{background:var(--danger)}
    .btn.danger:hover{background:#c0392b}
    .btn.success{background:var(--success)}
    .btn.success:hover{background:#229954}
    .btn.warning{background:var(--warning)}
    .btn.warning:hover{background:#d68910}
    .btn.block{display:block;width:100%;margin-top:12px}
    .btn.small{padding:8px 12px;font-size:12px}
    .btn-group{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
    .btn-group .btn{flex:1;min-width:100px}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
    .modal.active{display:flex}
    .modal-content{background:var(--card);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);width:100%;max-width:600px;padding:32px;position:relative}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted)}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
    .calendar-day{padding:8px;border:1px solid var(--input-border);border-radius:8px;text-align:center;cursor:pointer;font-size:13px}
    .calendar-day:hover{background:rgba(31,122,219,0.1)}
    .calendar-event{padding:12px;background:var(--input-bg);border-left:4px solid var(--primary);border-radius:6px;margin-bottom:8px;font-size:13px}
    .class-item{padding:16px;background:var(--input-bg);border-radius:8px;margin-bottom:12px;border:1px solid var(--input-border)}
    .class-item h4{margin:0 0 8px 0;color:var(--primary)}
    .class-item p{margin:0;color:var(--muted);font-size:13px}
    .admin-section{background:rgba(31,122,219,0.05);padding:20px;border-radius:12px;border:1px solid var(--primary)}
    .small{font-size:12px;color:var(--muted);margin-top:6px}
    .form-row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
    .form-row input,.form-row select{flex:1;min-width:150px}
    .tabs-subtabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .subtab-btn{padding:8px 14px;border-radius:6px;border:1px solid var(--input-border);background:transparent;cursor:pointer;font-size:13px;transition:all 0.3s}
    .subtab-btn.active{background:var(--primary);color:white;border-color:var(--primary)}
    @media(max-width:768px){
      .container{padding:12px}
      .note-grid{grid-template-columns:1fr}
      .modal-content{max-width:95%}
      .form-row{flex-direction:column}
      header{flex-direction:column;align-items:flex-start}
      .tabs{flex-direction:column}
    }
  </style>
</head>
<body class="light-theme">
  <div class="container">
    <header>
      <h1>📚 Учитель Онлайн V6.0.0</h1>
      <div id="userInfo" class="small"></div>
    </header>

    <div id="loginBox" class="card">
      <h3>Вход в систему</h3>
      <input id="login" placeholder="Логин" autocomplete="username">
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
      <button id="loginBtn" class="btn block">Войти</button>
      <div id="loginError" class="small" style="color:var(--danger)"></div>
    </div>

    <div id="mainBox" style="display:none">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('materials')">📄 Материалы</button>
        <button class="tab-btn" onclick="switchTab('calendar')">📅 Календарь</button>
        <button class="tab-btn" onclick="switchTab('news')">📰 Новости</button>
        <button class="tab-btn" onclick="switchTab('guides')">📚 Пособия</button>
        <button class="tab-btn" onclick="switchTab('tests')">🧪 Тесты</button>
        <button class="tab-btn" id="adminTabBtn" onclick="switchTab('admin')" style="display:none">⚙️ Панель</button>
      </div>

      <!-- МАТЕРИАЛЫ -->
      <div id="materials" class="tab-content active">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
            <h3 style="margin:0">Материалы</h3>
            <button id="logoutBtn" class="btn ghost">Выйти</button>
          </div>
          <input id="title" placeholder="Название материала">
          <textarea id="desc" placeholder="Описание материала"></textarea>
          <input id="image" type="file" accept="image/*">
          <label style="margin-top:12px;font-weight:600">Видимость для классов:</label>
          <select id="classSelect" multiple style="min-height:100px">
            <option value="">Всем</option>
          </select>
          <div class="btn-group">
            <button id="addNoteBtn" class="btn">Добавить</button>
            <button id="refreshBtn" class="btn ghost">Обновить</button>
          </div>
          <div id="notesList" class="note-grid"></div>
        </div>
      </div>

      <!-- КАЛЕНДАРЬ -->
      <div id="calendar" class="tab-content">
        <div class="card">
          <h3>📅 Календарь</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
            <div>
              <h4>Добавить событие</h4>
              <input id="eventTitle" placeholder="Название события">
              <textarea id="eventDesc" placeholder="Описание события" style="min-height:80px"></textarea>
              <input id="eventDate" type="date">
              <input id="eventTime" type="time">
              <label style="margin-top:12px;font-weight:600">Видимость:</label>
              <select id="eventVisibility">
                <option value="private">Только мне</option>
                <option value="public">Всем</option>
                <option value="class">Выбранным классам</option>
              </select>
              <button id="addEventBtn" class="btn block" style="margin-top:12px">Добавить</button>
            </div>
            <div>
              <h4>События</h4>
              <div id="calendarEventsList" style="max-height:400px;overflow-y:auto"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- НОВОСТИ -->
      <div id="news" class="tab-content">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
            <h3 style="margin:0">Новости</h3>
            <div id="newsAdminBtn" style="display:none">
              <button id="addNewsBtn" class="btn ghost">+ Добавить</button>
            </div>
          </div>
          <div id="newsForm" style="display:none;margin-bottom:16px;padding:16px;background:rgba(31,122,219,0.05);border-radius:8px">
            <input id="newsTitle" placeholder="Заголовок">
            <textarea id="newsDesc" placeholder="Содержание"></textarea>
            <input id="newsImage" type="file" accept="image/*">
            <label style="margin-top:12px;font-weight:600">Классы:</label>
            <select id="newsClasses" multiple style="min-height:80px">
              <option value="">Всем</option>
            </select>
            <div class="btn-group">
              <button id="saveNewsBtn" class="btn">Сохранить</button>
              <button id="cancelNewsBtn" class="btn ghost">Отменить</button>
            </div>
          </div>
          <div id="newsList" class="note-grid"></div>
        </div>
      </div>

      <!-- ПОСОБИЯ -->
      <div id="guides" class="tab-content">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
            <h3 style="margin:0">Пособия</h3>
            <div id="guidesAdminBtn" style="display:none">
              <button id="addGuideBtn" class="btn ghost">+ Добавить</button>
            </div>
          </div>
          <div id="guidesForm" style="display:none;margin-bottom:16px;padding:16px;background:rgba(31,122,219,0.05);border-radius:8px">
            <input id="guideTitle" placeholder="Название">
            <textarea id="guideDesc" placeholder="Описание"></textarea>
            <input id="guideImage" type="file" accept="image/*">
            <label style="margin-top:12px;font-weight:600">Классы:</label>
            <select id="guideClasses" multiple style="min-height:80px">
              <option value="">Всем</option>
            </select>
            <div class="btn-group">
              <button id="saveGuideBtn" class="btn">Сохранить</button>
              <button id="cancelGuideBtn" class="btn ghost">Отменить</button>
            </div>
          </div>
          <div id="guidesList" class="note-grid"></div>
        </div>
      </div>

      <!-- ТЕСТЫ -->
      <div id="tests" class="tab-content">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
            <h3 style="margin:0">Тесты</h3>
            <div id="testsAdminBtn" style="display:none">
              <button id="createTestBtn" class="btn ghost">+ Создать тест</button>
            </div>
          </div>
          <div id="testsList" class="note-grid"></div>
        </div>
      </div>

      <!-- ПАНЕЛЬ АДМИНИСТРАТОРА -->
      <div id="admin" class="tab-content">
        <div class="card admin-section">
          <h3>⚙️ Учительская панель</h3>

          <h4 style="margin-top:20px">Управление классами</h4>
          <div class="form-row">
            <input id="className" placeholder="Название класса" style="flex:2">
            <button id="addClassBtn" class="btn">Создать класс</button>
          </div>
          <div id="classesList" style="margin-top:16px;max-height:300px;overflow-y:auto"></div>

          <h4 style="margin-top:20px">Управление пользователями</h4>
          <div class="form-row">
            <input id="u_login" placeholder="Логин" style="flex:1;min-width:100px">
            <input id="u_pass" placeholder="Пароль" style="flex:1;min-width:100px">
            <select id="u_role" style="flex:1;min-width:80px">
              <option value="student">Ученик</option>
              <option value="admin">Админ</option>
            </select>
            <button id="saveUserBtn" class="btn">Сохранить</button>
          </div>
          <div class="form-row">
            <input id="del_login" placeholder="Логин для удаления" style="flex:1;min-width:150px">
            <button id="delUserBtn" class="btn danger">Удалить</button>
          </div>

          <h4 style="margin-top:20px">Тема оформления</h4>
          <div class="form-row">
            <select id="themeSel">
              <option value="light">Светлая</option>
              <option value="dark">Тёмная</option>
            </select>
            <button id="themeBtn" class="btn">Применить</button>
          </div>

          <h4 style="margin-top:20px">Пользователи</h4>
          <div id="usersList" style="max-height:200px;overflow-y:auto;border:1px solid var(--input-border);padding:12px;border-radius:8px;background:var(--input-bg)"></div>

          <h4 style="margin-top:20px">Результаты тестов</h4>
          <button id="loadResultsBtn" class="btn ghost">Загрузить результаты</button>
          <div id="resultsList" style="max-height:200px;overflow-y:auto;margin-top:12px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛИ -->
  <div id="testModal" class="modal">
    <div class="modal-content" style="max-width:700px">
      <button class="modal-close" onclick="closeTestModal()">✕</button>
      <h2 id="testModalTitle">Тест</h2>
      <div id="testContent"></div>
      <div class="btn-group">
        <button id="prevBtn" class="btn ghost">← Назад</button>
        <button id="nextBtn" class="btn">Далее →</button>
        <button id="submitBtn" class="btn success" style="display:none">Отправить</button>
      </div>
    </div>
  </div>

  <div id="testWizardModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeWizardModal()">✕</button>
      <h2>Создание теста</h2>
      <div id="wizardStep1" style="display:block">
        <label>Название теста:</label>
        <input id="wizTestTitle" placeholder="Введите название">
        <label style="margin-top:12px">Описание:</label>
        <textarea id="wizTestDesc" placeholder="Описание теста"></textarea>
        <button id="nextWizStep1" class="btn block" style="margin-top:16px">Далее</button>
      </div>
      <div id="wizardStep2" style="display:none">
        <label>Вопрос:</label>
        <input id="wizQuestion" placeholder="Введите вопрос">
        <label style="margin-top:12px">Тип:</label>
        <select id="wizQType">
          <option value="single">Один ответ</option>
          <option value="multiple">Несколько ответов</option>
        </select>
        <label style="margin-top:12px">Варианты ответов (через запятую):</label>
        <input id="wizChoices" placeholder="Ответ 1, Ответ 2, Ответ 3">
        <label style="margin-top:12px">Правильные ответы (через запятую):</label>
        <input id="wizAnswers" placeholder="Ответ 1">
        <button id="addWizQuestion" class="btn">Добавить вопрос</button>
        <div id="wizQuestionsPreview" style="margin-top:16px"></div>
        <div class="btn-group" style="margin-top:16px">
          <button id="backWizStep2" class="btn ghost">Назад</button>
          <button id="finishWizTest" class="btn success">Создать тест</button>
        </div>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEditModal()">✕</button>
      <h2>Редактирование материала</h2>
      <input id="editTitle" placeholder="Название">
      <textarea id="editDesc" placeholder="Описание"></textarea>
      <input id="editImage" type="file" accept="image/*">
      <label style="margin-top:12px;font-weight:600">Классы:</label>
      <select id="editClasses" multiple style="min-height:80px;margin-top:8px">
        <option value="">Всем</option>
      </select>
      <div class="btn-group" style="margin-top:16px">
        <button class="btn ghost" onclick="closeEditModal()">Отменить</button>
        <button class="btn success" id="saveEditBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let current = "", role = "", currentPass = "";
    let currentTestData = null, currentQuestionIndex = 0, testAnswers = [];
    let wizardQuestions = [];
    let currentEditIndex = -1, currentEditType = "";
    let classes_data = [];
    let calendarEvents = [];

    async function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tab).classList.add("active");
      event.target.classList.add("active");
      
      if (tab === "calendar") loadCalendar();
      if (tab === "admin") loadClasses();
    }

    async function login() {
      const login = document.getElementById("login").value;
      const password = document.getElementById("password").value;
      if (!login || !password) {
        document.getElementById("loginError").textContent = "Логин и пароль обязательны";
        return;
      }
      try {
        const res = await fetch(API + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (data.ok) {
          current = login;
          currentPass = password;
          role = data.role;
          document.getElementById("loginBox").style.display = "none";
          document.getElementById("mainBox").style.display = "block";
          document.getElementById("userInfo").textContent = `👤 ${login} (${role === "admin" ? "Учитель" : "Ученик"})`;
          document.getElementById("adminTabBtn").style.display = role === "admin" ? "block" : "none";
          if (role === "admin") {
            document.getElementById("newsAdminBtn").style.display = "block";
            document.getElementById("guidesAdminBtn").style.display = "block";
            document.getElementById("testsAdminBtn").style.display = "block";
          }
          loadClasses();
          loadNotes();
          loadNews();
          loadGuides();
          loadTests();
        } else {
          document.getElementById("loginError").textContent = data.error;
        }
      } catch (e) {
        document.getElementById("loginError").textContent = "Ошибка подключения";
      }
    }

    async function loadClasses() {
      try {
        const res = await fetch(API + "/classes");
        classes_data = await res.json();
        updateClassSelects();
      } catch (e) {
        console.error("Error loading classes:", e);
      }
    }

    function updateClassSelects() {
      const selects = ["classSelect", "newsClasses", "guideClasses", "editClasses"];
      selects.forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        const current = select.value;
        select.innerHTML = '<option value="">Всем</option>';
        classes_data.forEach(cls => {
          const opt = document.createElement("option");
          opt.value = cls.id;
          opt.textContent = cls.name;
          select.appendChild(opt);
        });
        select.value = current;
      });
    }

    async function loadCalendar() {
      try {
        const res = await fetch(API + "/calendar?user=" + current);
        calendarEvents = await res.json();
        displayCalendarEvents();
      } catch (e) {
        console.error("Error loading calendar:", e);
      }
    }

    function displayCalendarEvents() {
      const list = document.getElementById("calendarEventsList");
      list.innerHTML = "";
      calendarEvents.forEach((event, idx) => {
        const div = document.createElement("div");
        div.className = "calendar-event";
        div.innerHTML = `
          <strong>${event.title}</strong><br>
          📅 ${event.date} ⏰ ${event.time}<br>
          <small>${event.description}</small>
          <div style="margin-top:8px;display:flex;gap:4px">
            ${event.created_by === current || role === "admin" ? `
              <button class="btn small" onclick="editCalendarEvent(${event.id})">✏️</button>
              <button class="btn small danger" onclick="deleteCalendarEvent(${event.id})">🗑️</button>
            ` : ""}
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function addCalendarEvent() {
      const title = document.getElementById("eventTitle").value;
      const description = document.getElementById("eventDesc").value;
      const date = document.getElementById("eventDate").value;
      const time = document.getElementById("eventTime").value;
      const visibility = document.getElementById("eventVisibility").value;

      if (!title || !date || !time) {
        alert("Заполните все поля");
        return;
      }

      try {
        await fetch(API + "/calendar/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: current, title, description, date, time, visibility, visible_to: [] })
        });
        document.getElementById("eventTitle").value = "";
        document.getElementById("eventDesc").value = "";
        document.getElementById("eventDate").value = "";
        document.getElementById("eventTime").value = "";
        loadCalendar();
      } catch (e) {
        console.error("Error adding event:", e);
      }
    }

    async function deleteCalendarEvent(id) {
      if (!confirm("Удалить событие?")) return;
      try {
        await fetch(API + "/calendar/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, user: current, payload: { admin_login: current, admin_password: currentPass } })
        });
        loadCalendar();
      } catch (e) {
        console.error("Error deleting event:", e);
      }
    }

    async function addAdminClass() {
      const name = document.getElementById("className").value;
      if (!name) {
        alert("Введите название класса");
        return;
      }
      try {
        await fetch(API + "/admin/classes/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, description: "", admin_login: current, admin_password: currentPass })
        });
        document.getElementById("className").value = "";
        loadClasses();
        displayAdminClasses();
      } catch (e) {
        console.error("Error adding class:", e);
      }
    }

    async function displayAdminClasses() {
      const list = document.getElementById("classesList");
      list.innerHTML = "";
      classes_data.forEach(cls => {
        const div = document.createElement("div");
        div.className = "class-item";
        div.innerHTML = `
          <h4>${cls.name}</h4>
          <p>Учеников: ${cls.students ? cls.students.length : 0}</p>
          <div style="margin-top:8px;display:flex;gap:6px">
            <button class="btn small ghost" onclick="editClass(${cls.id})">✏️</button>
            <button class="btn small danger" onclick="deleteClass(${cls.id})">🗑️</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function deleteClass(id) {
      if (!confirm("Удалить класс?")) return;
      try {
        await fetch(API + "/admin/classes/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, admin_login: current, admin_password: currentPass })
        });
        loadClasses();
        displayAdminClasses();
      } catch (e) {
        console.error("Error deleting class:", e);
      }
    }

    async function loadNotes() {
      try {
        const res = await fetch(API + "/notes");
        const notes = await res.json();
        const list = document.getElementById("notesList");
        list.innerHTML = "";
        notes.forEach((note, idx) => {
          const card = document.createElement("div");
          card.className = "note-card";
          const classInfo = note.classes && note.classes.length > 0 
            ? classes_data.find(c => c.id == note.classes[0])
            : null;
          card.innerHTML = `
            <h4>${note.title}</h4>
            <p>${note.desc}</p>
            ${note.classes && note.classes.length > 0 ? `<span class="badge badge-class">${classInfo ? classInfo.name : "Класс"}</span>` : ""}
            <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
              ${role === "admin" ? `
                <button class="btn small ghost" onclick="editNote(${idx})">✏️</button>
                <button class="btn small danger" onclick="deleteNote(${idx})">🗑️</button>
              ` : note.user === current ? `
                <button class="btn small ghost" onclick="editNote(${idx})">✏️</button>
              ` : ""}
            </div>
          `;
          list.appendChild(card);
        });
      } catch (e) {
        console.error("Error loading notes:", e);
      }
    }

    async function addNote() {
      const title = document.getElementById("title").value;
      const desc = document.getElementById("desc").value;
      const classes = Array.from(document.getElementById("classSelect").selectedOptions).map(o => o.value);

      if (!title) {
        alert("Введите название");
        return;
      }

      try {
        await fetch(API + "/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, desc, user: current, image: "", assignedTo: "", classes })
        });
        document.getElementById("title").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("image").value = "";
        loadNotes();
      } catch (e) {
        console.error("Error adding note:", e);
      }
    }

    async function deleteNote(idx) {
      if (!confirm("Удалить?")) return;
      try {
        await fetch(API + "/admin/notes/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: idx, admin_login: current, admin_password: currentPass })
        });
        loadNotes();
      } catch (e) {
        console.error("Error:", e);
      }
    }

    function editNote(idx) {
      currentEditIndex = idx;
      currentEditType = "note";
      document.getElementById("editModal").classList.add("active");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("active");
    }

    async function loadNews() {
      try {
        const res = await fetch(API + "/news");
        const items = await res.json();
        const list = document.getElementById("newsList");
        list.innerHTML = "";
        items.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "note-card";
          card.innerHTML = `
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
            ${role === "admin" ? `
              <div style="margin-top:12px;display:flex;gap:6px">
                <button class="btn small ghost" onclick="editNewsItem(${idx})">✏️</button>
                <button class="btn small danger" onclick="deleteNewsItem(${idx})">🗑️</button>
              </div>
            ` : ""}
          `;
          list.appendChild(card);
        });
      } catch (e) {
        console.error("Error:", e);
      }
    }

    async function loadGuides() {
      try {
        const res = await fetch(API + "/guides");
        const items = await res.json();
        const list = document.getElementById("guidesList");
        list.innerHTML = "";
        items.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "note-card";
          card.innerHTML = `
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
            ${role === "admin" ? `
              <div style="margin-top:12px;display:flex;gap:6px">
                <button class="btn small ghost" onclick="editGuideItem(${idx})">✏️</button>
                <button class="btn small danger" onclick="deleteGuideItem(${idx})">🗑️</button>
              </div>
            ` : ""}
          `;
          list.appendChild(card);
        });
      } catch (e) {
        console.error("Error:", e);
      }
    }

    async function loadTests() {
      try {
        const res = await fetch(API + "/tests");
        const tests = await res.json();
        const list = document.getElementById("testsList");
        list.innerHTML = "";
        tests.forEach((test, idx) => {
          const card = document.createElement("div");
          card.className = "note-card";
          card.innerHTML = `
            <h4>${test.title || "Тест"}</h4>
            <p>Вопросов: ${test.questions ? test.questions.length : 0}</p>
            <button class="btn small" onclick="startTest(${idx})" style="margin-top:12px">Пройти тест</button>
          `;
          list.appendChild(card);
        });
      } catch (e) {
        console.error("Error:", e);
      }
    }

    function startTest(idx) {
      currentTestData = null;
      fetch(API + "/tests").then(r => r.json()).then(tests => {
        currentTestData = tests[idx];
        currentQuestionIndex = 0;
        testAnswers = [];
        document.getElementById("testModal").classList.add("active");
        displayTestQuestion();
      });
    }

    function displayTestQuestion() {
      if (!currentTestData) return;
      const q = currentTestData.questions[currentQuestionIndex];
      let html = `<div style="margin-bottom:20px">
        <p style="font-size:12px;color:var(--muted)">Вопрос ${currentQuestionIndex + 1} из ${currentTestData.questions.length}</p>
        <h4>${q.q}</h4>`;
      
      if (q.choices && q.choices.length > 0) {
        if (q.type === "multiple") {
          q.choices.forEach((choice, i) => {
            html += `<label style="display:flex;gap:8px;margin-top:10px;cursor:pointer;padding:8px;border-radius:6px;background:var(--input-bg)">
              <input type="checkbox" value="${choice}" onchange="updateAnswer(${i}, this.checked, true)">
              ${choice}
            </label>`;
          });
        } else {
          q.choices.forEach((choice, i) => {
            html += `<label style="display:flex;gap:8px;margin-top:10px;cursor:pointer;padding:8px;border-radius:6px;background:var(--input-bg)">
              <input type="radio" name="answer" value="${choice}" onchange="updateAnswer(${i}, true, false)">
              ${choice}
            </label>`;
          });
        }
      }
      html += `</div>`;
      document.getElementById("testContent").innerHTML = html;
      
      document.getElementById("prevBtn").style.display = currentQuestionIndex > 0 ? "inline-block" : "none";
      if (currentQuestionIndex < currentTestData.questions.length - 1) {
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("submitBtn").style.display = "none";
      } else {
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("submitBtn").style.display = "inline-block";
      }
    }

    function updateAnswer(idx, value, isMultiple) {
      if (!testAnswers[currentQuestionIndex]) testAnswers[currentQuestionIndex] = isMultiple ? [] : null;
      if (isMultiple) {
        if (value) {
          if (!testAnswers[currentQuestionIndex].includes(idx)) testAnswers[currentQuestionIndex].push(idx);
        } else {
          testAnswers[currentQuestionIndex] = testAnswers[currentQuestionIndex].filter(x => x !== idx);
        }
      } else {
        testAnswers[currentQuestionIndex] = idx;
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < currentTestData.questions.length - 1) {
        currentQuestionIndex++;
        displayTestQuestion();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayTestQuestion();
      }
    }

    async function submitTest() {
      const answers = testAnswers.map((ans, i) => {
        const q = currentTestData.questions[i];
        if (Array.isArray(ans)) {
          return ans.map(idx => q.choices[idx]);
        } else if (ans !== null && ans !== undefined) {
          return q.choices[ans];
        }
        return null;
      });

      try {
        const res = await fetch(API + "/tests/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ test_id: currentTestData.id, answers, user: current })
        });
        const result = await res.json();
        document.getElementById("testContent").innerHTML = `
          <div style="text-align:center;padding:40px">
            <h3>Результат: ${result.score}/${result.total}</h3>
            <h2 style="color:var(--primary)">${result.percentage}%</h2>
          </div>
        `;
        document.getElementById("prevBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("submitBtn").style.display = "none";
      } catch (e) {
        console.error("Error:", e);
      }
    }

    function closeTestModal() {
      document.getElementById("testModal").classList.remove("active");
    }

    function closeWizardModal() {
      document.getElementById("testWizardModal").classList.remove("active");
    }

    function deleteNewsItem(idx) {
      if (!confirm("Удалить?")) return;
      fetch(API + "/admin/news/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: idx, admin_login: current, admin_password: currentPass })
      }).then(() => loadNews());
    }

    function deleteGuideItem(idx) {
      if (!confirm("Удалить?")) return;
      fetch(API + "/admin/guides/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: idx, admin_login: current, admin_password: currentPass })
      }).then(() => loadGuides());
    }

    // Event listeners
    document.getElementById("loginBtn").onclick = login;
    document.getElementById("logoutBtn").onclick = () => {
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("mainBox").style.display = "none";
      current = role = "";
    };
    document.getElementById("addNoteBtn").onclick = addNote;
    document.getElementById("refreshBtn").onclick = loadNotes;
    document.getElementById("addEventBtn").onclick = addCalendarEvent;
    document.getElementById("addClassBtn").onclick = addAdminClass;
    document.getElementById("addNewsBtn").onclick = () => {
      document.getElementById("newsForm").style.display = 
        document.getElementById("newsForm").style.display === "none" ? "block" : "none";
    };
    document.getElementById("addGuideBtn").onclick = () => {
      document.getElementById("guidesForm").style.display = 
        document.getElementById("guidesForm").style.display === "none" ? "block" : "none";
    };
    document.getElementById("createTestBtn").onclick = () => {
      document.getElementById("testWizardModal").classList.add("active");
    };
    document.getElementById("saveUserBtn").onclick = async () => {
      const login = document.getElementById("u_login").value;
      const password = document.getElementById("u_pass").value;
      const role_val = document.getElementById("u_role").value;
      if (!login) { alert("Введите логин"); return; }
      await fetch(API + "/admin/users/add_or_update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login, password, role: role_val, admin_login: current, admin_password: currentPass })
      });
      document.getElementById("u_login").value = "";
      document.getElementById("u_pass").value = "";
      loadUsersList();
    };
    document.getElementById("delUserBtn").onclick = async () => {
      const login = document.getElementById("del_login").value;
      if (!login) { alert("Введите логин"); return; }
      await fetch(API + "/admin/users/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login, admin_login: current, admin_password: currentPass })
      });
      document.getElementById("del_login").value = "";
      loadUsersList();
    };
    document.getElementById("themeBtn").onclick = async () => {
      const theme = document.getElementById("themeSel").value;
      await fetch(API + "/admin/settings/theme", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme, admin_login: current, admin_password: currentPass })
      });
      document.body.className = theme + "-theme";
      localStorage.setItem("theme", theme);
    };
    document.getElementById("loadResultsBtn").onclick = async () => {
      const res = await fetch(API + "/admin/results", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_login: current, admin_password: currentPass })
      });
      const results = await res.json();
      let html = "";
      results.forEach(r => {
        html += `<div style="padding:8px;border-bottom:1px solid var(--input-border);font-size:12px">
          <strong>${r.user}</strong>: ${r.score}/${r.total} (${r.percentage}%)
        </div>`;
      });
      document.getElementById("resultsList").innerHTML = html;
    };

    async function loadUsersList() {
      const res = await fetch(API + "/admin/users/list", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_login: current, admin_password: currentPass })
      });
      const users = await res.json();
      let html = "";
      Object.keys(users).forEach(login => {
        html += `<div style="padding:6px;font-size:12px">${login} - ${users[login].role}</div>`;
      });
      document.getElementById("usersList").innerHTML = html;
    }

    document.getElementById("nextBtn").onclick = nextQuestion;
    document.getElementById("prevBtn").onclick = prevQuestion;
    document.getElementById("submitBtn").onclick = submitTest;

    // Initialize
    const theme = localStorage.getItem("theme") || "light";
    document.body.className = theme + "-theme";
    document.getElementById("themeSel").value = theme;
  </script>
</body>
